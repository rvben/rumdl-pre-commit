name: Mirror rumdl version

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pypi_release]

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: set git config
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run mirror.py
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: uv run mirror.py

      - name: Check for unpushed commits
        id: check_unpushed
        run: |
          UNPUSHED_COMMITS=$(git log origin/main..HEAD)
          if [ -z "$UNPUSHED_COMMITS" ]; then
            echo "No unpushed commits found."
            echo "changes_exist=false" >> $GITHUB_ENV
          else
            echo "Unpushed commits found."
            echo "changes_exist=true" >> $GITHUB_ENV
          fi

      - name: Push changes if they exist
        if: env.changes_exist == 'true'
        run: git push origin HEAD:refs/heads/main --tags

      - name: Create release on new tag if new changes exist
        if: env.changes_exist == 'true'
        run: |
          TAG_NAME=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "Creating release for $TAG_NAME"
          for i in 1 2 3 4 5; do
            if gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "See: https://github.com/rvben/rumdl/releases/tag/$TAG_NAME" \
              --latest; then
              echo "Release created successfully"
              exit 0
            fi
            echo "Attempt $i failed, waiting 10s for tag to propagate..."
            sleep 10
          done
          echo "Failed to create release after 5 attempts"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
